<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOYFIT24 経堂 お客様アンケート VOL.2｜名刺POP 8面付け</title>
  <style>
    @page { size: A4 portrait; margin: 0; }
    :root {
      --joy: #C21632;
      --joy-dark: #9E1028;
      --joy-pale: #F8DDE2;
      --ink: #2a2a2a;
      --muted: #555555;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #eceff3;
      font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    }
    .toolbar {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 20;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: var(--joy);
      box-shadow: 0 6px 16px rgba(194, 22, 50, 0.38);
      cursor: pointer;
    }
    /* A4: 2列 × 4行 = 8枚（名刺サイズ 91×55mm 想定） */
    .sheet {
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      background: #fff;
      padding: 3.5mm;
      display: grid;
      grid-template-columns: repeat(2, 91mm);
      grid-template-rows: repeat(4, 55mm);
      gap: 3mm 4mm;
      justify-content: center;
      align-content: center;
      box-shadow: 0 5mm 14mm rgba(31, 41, 55, 0.12);
    }
    .card {
      position: relative;
      width: 91mm;
      height: 55mm;
      border: 0.35mm solid var(--joy-pale);
      border-top: 1.8mm solid var(--joy);
      border-left: 0.8mm solid var(--joy);
      background: #fff;
      padding: 3mm 3.2mm 2.8mm;
      overflow: hidden;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 1.2mm;
      border: 0.2mm dashed rgba(0, 0, 0, 0.12);
      pointer-events: none;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2mm;
    }
    .head-text {
      flex: 1;
      min-width: 0;
      padding-right: 1mm;
    }
    .store {
      margin: 0;
      font-size: 3.2mm;
      font-weight: 900;
      color: var(--joy);
      letter-spacing: 0.06em;
    }
    .vol {
      margin: 0.8mm 0 0;
      font-size: 3.4mm;
      font-weight: 900;
      color: var(--joy);
      line-height: 1.2;
    }
    .qr {
      width: 22mm;
      height: 22mm;
      flex-shrink: 0;
      object-fit: contain;
      display: block;
      border: 0.45mm solid var(--joy);
      border-radius: 1.2mm;
      padding: 0.8mm;
      background: #fff;
    }
    .catch {
      margin: 2.2mm 0 0;
      font-size: 4.1mm;
      font-weight: 900;
      color: var(--joy);
      line-height: 1.28;
    }
    .body {
      margin: 1.8mm 0 0;
      font-size: 2.65mm;
      line-height: 1.5;
      color: var(--muted);
      font-weight: 500;
    }
    .cta {
      position: absolute;
      left: 3.2mm;
      right: 3.2mm;
      bottom: 2.6mm;
      margin: 0;
      padding-top: 1.2mm;
      border-top: 0.35mm solid var(--joy-pale);
      background: linear-gradient(180deg, #fff8f9 0%, #fff 100%);
      font-size: 3mm;
      font-weight: 900;
      color: var(--joy);
      text-align: center;
      letter-spacing: 0.02em;
    }
    @media print {
      html, body { background: #fff !important; }
      .toolbar { display: none !important; }
      .sheet {
        margin: 0 !important;
        box-shadow: none !important;
        padding: 0;
      }
      .card {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" type="button" onclick="window.print()">印刷する（A4・8面）</button>
  </div>

  <main class="sheet" id="sheet"></main>

  <template id="card-template">
    <section class="card">
      <div class="head">
        <div class="head-text">
          <p class="store">JOYFIT24 経堂</p>
          <p class="vol">お客様アンケートVOL.2</p>
        </div>
        <img class="qr" src="" alt="アンケートQR" width="220" height="220" />
      </div>
      <h2 class="catch">JOYFIT24経堂に<br>設置してほしいマシン！</h2>
      <p class="body">
        ご希望のマシン名や、参考になる商品ページ・画像があれば是非お知らせください。皆さまのお声をもとに、今後のサービスの参考にさせていただきます。
      </p>
      <p class="cta">右上QRを読み取ってご回答ください</p>
    </section>
  </template>

  <script>
    const SURVEY_URL = 'https://joyfit-kyodo-survey.vercel.app/vol2.html';
    const QR_SRC =
      'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(SURVEY_URL);

    const sheet = document.getElementById('sheet');
    const tpl = document.getElementById('card-template');
    for (let i = 0; i < 8; i += 1) {
      const card = tpl.content.cloneNode(true);
      card.querySelector('.qr').src = QR_SRC;
      sheet.appendChild(card);
    }
  </script>
</body>
</html>
