<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOYFIT24 経堂 お客様アンケート VOL.2｜名刺POP 8面付け</title>
  <style>
    @page { size: A4 portrait; margin: 0; }
    :root {
      --joy: #C21632;
      --joy-pale: #F8DDE2;
      --muted: #555555;
      --card-w: 91mm;
      --card-h: 55mm;
      --gap-x: 2mm;
      --gap-y: 2mm;
      /* A4中央配置: 横(210-2*91-2)/2=13, 縦(297-4*55-3*2)/2=35.5 */
      --sheet-pad-x: 13mm;
      --sheet-pad-y: 35.5mm;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #eceff3;
      font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    }
    .toolbar {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: var(--joy);
      box-shadow: 0 6px 16px rgba(194, 22, 50, 0.38);
      cursor: pointer;
    }
    .btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .btn-outline {
      background: #fff;
      color: var(--joy);
      border: 2px solid var(--joy);
      box-shadow: none;
    }
    body.exporting .sheet {
      box-shadow: none;
    }
    .sheet {
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      background: #fff;
      padding: var(--sheet-pad-y) var(--sheet-pad-x);
      display: grid;
      grid-template-columns: repeat(2, var(--card-w));
      grid-template-rows: repeat(4, var(--card-h));
      column-gap: var(--gap-x);
      row-gap: var(--gap-y);
      box-shadow: 0 5mm 14mm rgba(31, 41, 55, 0.12);
    }
    .card {
      width: var(--card-w);
      height: var(--card-h);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 1.2mm;
      border: 0.3mm solid var(--joy-pale);
      border-top: 1.2mm solid var(--joy);
      border-left: 0.6mm solid var(--joy);
      background: #fff;
      padding: 2mm 2.4mm 2mm;
      overflow: hidden;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5mm;
      flex-shrink: 0;
    }
    .head-text {
      flex: 1;
      min-width: 0;
    }
    .store {
      margin: 0;
      font-size: 3.1mm;
      font-weight: 900;
      color: var(--joy);
      letter-spacing: 0.04em;
      line-height: 1.2;
    }
    .vol {
      margin: 0.6mm 0 0;
      font-size: 3.2mm;
      font-weight: 900;
      color: var(--joy);
      line-height: 1.2;
    }
    .qr {
      width: 19mm;
      height: 19mm;
      flex-shrink: 0;
      object-fit: contain;
      display: block;
      border: 0.35mm solid var(--joy);
      border-radius: 0.8mm;
      padding: 0.5mm;
      background: #fff;
    }
    .catch {
      margin: 0;
      font-size: 3.75mm;
      font-weight: 900;
      color: var(--joy);
      line-height: 1.22;
      flex-shrink: 0;
    }
    .body {
      margin: 0;
      font-size: 2.6mm;
      line-height: 1.42;
      color: var(--muted);
      font-weight: 500;
      flex-shrink: 0;
    }
    .cta {
      margin: 0;
      padding-top: 0.9mm;
      border-top: 0.3mm solid var(--joy-pale);
      font-size: 2.85mm;
      font-weight: 900;
      color: var(--joy);
      text-align: center;
      letter-spacing: 0.01em;
      line-height: 1.2;
      flex-shrink: 0;
    }
    @media print {
      html, body { background: #fff !important; }
      .toolbar { display: none !important; }
      .sheet {
        margin: 0 !important;
        box-shadow: none !important;
        width: 210mm !important;
        height: 297mm !important;
        padding: var(--sheet-pad-y) var(--sheet-pad-x) !important;
      }
      .card {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn btn-outline" id="save-png-btn" type="button">PNGで保存</button>
    <button class="btn" type="button" onclick="window.print()">印刷する（A4・8面）</button>
  </div>

  <main class="sheet" id="sheet"></main>

  <template id="card-template">
    <section class="card">
      <div class="head">
        <div class="head-text">
          <p class="store">JOYFIT24 経堂</p>
          <p class="vol">お客様アンケートVOL.2</p>
        </div>
        <img class="qr" src="" alt="アンケートQR" width="190" height="190" />
      </div>
      <h2 class="catch">JOYFIT24経堂に<br>設置してほしいマシンを教えて下さい！</h2>
      <p class="body">
        ご希望のマシン名や、参考になる商品ページ・画像があれば是非お知らせください。皆さまのお声をもとに、今後のサービスの参考にさせていただきます。
      </p>
      <p class="cta">右上QRを読み取ってご回答ください</p>
    </section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const SURVEY_URL = 'https://joyfit-kyodo-survey.vercel.app/vol2.html';
    const QR_SRC =
      'https://api.qrserver.com/v1/create-qr-code/?size=380x380&data=' + encodeURIComponent(SURVEY_URL);
    const PNG_WIDTH = 2480;
    const PNG_HEIGHT = 3508;

    const sheet = document.getElementById('sheet');
    const tpl = document.getElementById('card-template');
    const saveBtn = document.getElementById('save-png-btn');

    async function fetchQrDataUrl() {
      const res = await fetch(QR_SRC);
      if (!res.ok) throw new Error('QR画像の取得に失敗しました');
      const blob = await res.blob();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function initCards() {
      const qrDataUrl = await fetchQrDataUrl();
      for (let i = 0; i < 8; i += 1) {
        const card = tpl.content.cloneNode(true);
        card.querySelector('.qr').src = qrDataUrl;
        sheet.appendChild(card);
      }
    }

    async function waitForImages(root) {
      const images = [...root.querySelectorAll('img')];
      await Promise.all(images.map((img) => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise((resolve) => {
          img.addEventListener('load', resolve, { once: true });
          img.addEventListener('error', resolve, { once: true });
        });
      }));
    }

    async function savePng() {
      if (typeof html2canvas !== 'function') {
        alert('画像生成ライブラリの読み込みに失敗しました。ページを再読み込みしてください。');
        return;
      }

      saveBtn.disabled = true;
      const prevText = saveBtn.textContent;
      saveBtn.textContent = 'PNG作成中…';
      document.body.classList.add('exporting');

      try {
        await waitForImages(sheet);
        const scale = PNG_WIDTH / sheet.offsetWidth;
        const canvas = await html2canvas(sheet, {
          scale,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false,
          width: sheet.offsetWidth,
          height: sheet.offsetHeight,
        });

        const output = document.createElement('canvas');
        output.width = PNG_WIDTH;
        output.height = PNG_HEIGHT;
        const ctx = output.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, PNG_WIDTH, PNG_HEIGHT);
        ctx.drawImage(canvas, 0, 0, PNG_WIDTH, PNG_HEIGHT);

        const link = document.createElement('a');
        link.download = 'joyfit-kyodo-survey-pop-vol2-8up.png';
        link.href = output.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error(err);
        alert('PNGの保存に失敗しました。時間をおいて再度お試しください。');
      } finally {
        document.body.classList.remove('exporting');
        saveBtn.disabled = false;
        saveBtn.textContent = prevText;
      }
    }

    saveBtn.addEventListener('click', savePng);
    initCards().catch((err) => {
      console.error(err);
      alert('QR画像の読み込みに失敗しました。ネットワーク接続を確認してください。');
    });
  </script>
</body>
</html>
